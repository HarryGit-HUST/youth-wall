<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共青团华中科技大学委员会组织部招新 | 青声·星火相传</title>
    <!-- 引入 方正小标宋简体 WebFont CDN -->
    <link href="https://cdn.jsdelivr.net/npm/cn-fontsource-fz-xiao-biao-song-b-05-s-regular/font.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: "FZXiaoBiaoSong-B05S", "方正小标宋简体", "FZXiaoBiaoSongJS", "STSong", "SimSun", serif;
            background: #0a0c1b;
            color: #e2e8f0;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(25, 30, 60, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glow-border:hover {
            border-color: rgba(234, 179, 8, 0.6);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }

        input,
        textarea,
        select,
        button {
            font-family: inherit;
        }
    </style>
</head>

<body class="min-h-screen relative pb-20">
    <canvas id="canvas-bg"></canvas>

    <!-- 顶部 Banner：共青团中央官方正版团徽 + 组织部全称(加大) + 活动主题(调小) -->
    <header class="py-8 text-center px-4 flex flex-col items-center">
        <!-- 共青团中央官方正版透明底高清团徽原图（带多重容错备份） -->
        <img src="https://www.gqt.org.cn/ccylmaterial/tuanhui/200612/W020210917385587847094.png"
            onerror="this.onerror=null; this.src='http://qnzz.youth.cn/tqth/202108/W020210810548088637242.png';"
            alt="共青团团徽"
            class="w-16 h-16 md:w-20 md:h-20 mb-3 drop-shadow-[0_0_15px_rgba(251,191,36,0.7)] object-contain">

        <!-- 组织部全称（突出放大） -->
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-amber-300 tracking-wide drop-shadow-md">
            共青团华中科技大学委员会组织部
        </h1>

        <!-- “青声·星火相传” (调小字号) -->
        <div
            class="mt-3 px-4 py-1 bg-amber-500/10 border border-amber-500/30 rounded-full text-amber-200 text-sm md:text-base font-bold tracking-widest inline-block">
            ✦ 招新云端留言墙：「青声 · 星火相传」 ✦
        </div>

        <!-- 招新口号 -->
        <p class="text-sm md:text-base text-slate-300 font-medium mt-3 tracking-widest">
            起于平凡 · 臻于至善
        </p>
        <p class="text-xs text-slate-400 mt-1">万千声音，汇聚星光 — 期待你的加入</p>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="openModal(1)"
                class="px-6 py-3 rounded-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold hover:scale-105 transition shadow-lg shadow-amber-500/20">
                ✨ 表达留言
            </button>
            <button onclick="openModal(2)"
                class="px-6 py-3 rounded-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold hover:scale-105 transition shadow-lg shadow-indigo-500/20">
                ❓ 公开提问
            </button>
        </div>

        <section class="mb-10">
            <h2 class="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                📌 组织部往届成员寄语
            </h2>
            <div id="pinned-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-slate-500 text-sm">加载中...</p>
            </div>
        </section>

        <section>
            <h2 class="text-lg font-bold text-slate-300 mb-4 flex items-center gap-2">
                🌟 精彩留言 & 招新咨询
            </h2>
            <div id="wall-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-500 text-sm">加载中...</p>
            </div>
        </section>
    </main>

    <!-- 发布弹窗 -->
    <div id="publish-modal"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-lg rounded-2xl p-6 relative text-slate-100">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-amber-400">发表留言</h3>

            <form id="msg-form" onsubmit="submitMessage(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">板块标签</label>
                    <select id="form-tag"
                        class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 outline-none text-slate-100">
                        <option value="组织部直通车">组织部直通车</option>
                        <option value="青年寄语">青年寄语</option>
                        <option value="大学期待">大学期待</option>
                        <option value="军训感悟">军训感悟</option>
                    </select>
                </div>

                <div>
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>内容 (1-300字)</span>
                        <span id="char-count">0/300</span>
                    </div>
                    <textarea id="form-content" maxlength="300" required rows="4" oninput="updateCharCount(this)"
                        placeholder="写下对华中大团委组织部招新的想法、寄语或提问..."
                        class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-3 text-sm focus:border-amber-400 outline-none resize-none text-slate-100"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">发布身份</label>
                        <input type="text" id="form-author" placeholder="你的昵称/姓名"
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-400 outline-none text-slate-100">
                    </div>
                    <div class="flex items-end pb-2">
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-300">
                            <input type="checkbox" id="form-anonymous" onchange="toggleAnonymous(this)"
                                class="accent-amber-500 w-4 h-4">
                            匿名发布
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3 bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 rounded-lg transition">
                    提交审核
                </button>
            </form>
        </div>
    </div>

    <!-- 海报弹窗 -->
    <div id="poster-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="flex flex-col items-center max-w-sm w-full">
            <div id="poster-card"
                class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-6 rounded-2xl border border-amber-500/30 text-slate-100 w-full shadow-2xl relative overflow-hidden">
                <div class="text-[11px] text-amber-400 font-bold mb-2">✦ 共青团华中科技大学委员会组织部 ✦</div>
                <div id="poster-text" class="text-base font-medium my-4 leading-relaxed"></div>
                <div
                    class="border-t border-slate-700/60 pt-4 mt-4 flex justify-between items-center text-xs text-slate-400">
                    <div>
                        <p id="poster-author" class="font-bold text-slate-200"></p>
                        <p id="poster-date"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-amber-400 font-bold text-[11px]">青声 · 星火相传</p>
                        <p class="text-[10px] text-slate-400">起于平凡 · 臻于至善</p>
                    </div>
                </div>
            </div>
            <div class="flex gap-4 mt-4 w-full">
                <button onclick="downloadPoster()"
                    class="flex-1 py-2.5 bg-amber-500 font-bold text-slate-950 rounded-lg">保存海报图片</button>
                <button onclick="document.getElementById('poster-modal').classList.add('hidden')"
                    class="px-4 py-2.5 bg-slate-800 text-slate-300 rounded-lg">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yvepocklhzfcazmcssem.supabase.co";
        const SUPABASE_KEY = "sb_publishable_4BKM56OxqjtuDhD15L2Vbw_Jzgj0ndw";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const SENSITIVE_WORDS = ["打架", "色情", "赌博", "广告", "外挂", "骂人"];
        let currentType = 1;

        document.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            fetchMessages();
        });

        function openModal(type) {
            currentType = type;
            document.getElementById('modal-title').innerText = type === 1 ? '✨ 发表留言' : '❓ 组织部招新提问';
            document.getElementById('publish-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('publish-modal').classList.add('hidden');
        }

        function updateCharCount(el) {
            document.getElementById('char-count').innerText = `${el.value.length}/300`;
        }

        function toggleAnonymous(checkbox) {
            const authorInput = document.getElementById('form-author');
            if (checkbox.checked) {
                authorInput.value = '';
                authorInput.disabled = true;
                authorInput.placeholder = '匿名小星火';
            } else {
                authorInput.disabled = false;
                authorInput.placeholder = '你的昵称/姓名';
            }
        }

        async function submitMessage(e) {
            e.preventDefault();
            const content = document.getElementById('form-content').value.trim();
            const tag = document.getElementById('form-tag').value;
            const isAnonymous = document.getElementById('form-anonymous').checked;
            let author = document.getElementById('form-author').value.trim();

            if (!author && !isAnonymous) author = "热心同学";
            if (isAnonymous) author = "匿名小星火";

            for (let word of SENSITIVE_WORDS) {
                if (content.includes(word)) {
                    alert(`包含敏感词汇 [${word}]，请修改后重试！`);
                    return;
                }
            }

            const { error } = await supabaseClient.from('messages').insert([{
                type: currentType,
                content: content,
                author_name: author,
                is_anonymous: isAnonymous,
                tag: tag,
                status: 0
            }]);

            if (error) {
                alert('提交失败：' + error.message);
            } else {
                alert('提交成功！管理员将在30分钟内审核，通过后即可上墙。');
                closeModal();
                document.getElementById('msg-form').reset();
            }
        }

        async function fetchMessages() {
            const { data, error } = await supabaseClient.from('messages')
                .select('*')
                .or('status.eq.1,is_pinned.eq.true')
                .order('created_at', { ascending: false });

            const pinnedContainer = document.getElementById('pinned-container');
            const wallContainer = document.getElementById('wall-container');
            pinnedContainer.innerHTML = '';
            wallContainer.innerHTML = '';

            if (error || !data || data.length === 0) {
                pinnedContainer.innerHTML = '<p class="text-slate-500 text-sm">暂无寄语</p>';
                wallContainer.innerHTML = '<p class="text-slate-500 text-sm">暂无公开留言，快来抢沙发吧！</p>';
                return;
            }

            data.forEach(msg => {
                const card = createCardHTML(msg);
                if (msg.is_pinned) {
                    pinnedContainer.innerHTML += card;
                } else if (msg.status === 1) {
                    wallContainer.innerHTML += card;
                }
            });
        }

        function createCardHTML(msg) {
            const isQuestion = msg.type === 2;
            const dateStr = new Date(msg.created_at).toLocaleDateString('zh-CN');
            return `
                <div class="glass-card rounded-xl p-5 relative flex flex-col justify-between glow-border transition duration-300">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs px-2.5 py-1 rounded-full ${isQuestion ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">
                                ${isQuestion ? '❓ 提问' : '💬 留言'} · ${msg.tag}
                            </span>
                            <span class="text-xs text-slate-500">${dateStr}</span>
                        </div>
                        <p class="text-slate-200 text-sm leading-relaxed mb-4">${msg.content}</p>
                        ${msg.reply_content ? `
                            <div class="bg-amber-500/10 border-l-2 border-amber-400 p-2.5 rounded-r text-xs text-amber-200/90 mb-3">
                                <span class="font-bold block mb-0.5">组织部官方回复：</span>${msg.reply_content}
                            </div>
                        ` : ''}
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800">
                        <span>BY: ${msg.is_anonymous ? '匿名小星火' : msg.author_name}</span>
                        <button onclick="generatePoster('${encodeURIComponent(msg.content)}', '${msg.author_name}', '${dateStr}')" class="text-amber-400 hover:underline">
                            生成海报 🖼️
                        </button>
                    </div>
                </div>
            `;
        }

        function generatePoster(content, author, date) {
            document.getElementById('poster-text').innerText = decodeURIComponent(content);
            document.getElementById('poster-author').innerText = `—— ${author}`;
            document.getElementById('poster-date').innerText = date;
            document.getElementById('poster-modal').classList.remove('hidden');
        }

        function downloadPoster() {
            html2canvas(document.getElementById('poster-card')).then(canvas => {
                const link = document.createElement('a');
                link.download = '华中大团委组织部-招新海报.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function initCanvas() {
            const canvas = document.getElementById('canvas-bg');
            const ctx = canvas.getContext('2d');
            let stars = [];
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);
            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                });
            }
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(251, 191, 36, ${s.alpha})`;
                    ctx.fill();
                    s.y -= 0.3;
                    if (s.y < 0) s.y = canvas.height;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>

</html>
