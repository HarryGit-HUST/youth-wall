<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共青团华中科技大学委员会组织部 — 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/cn-fontsource-fz-xiao-biao-song-b-05-s-regular/font.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: "FZXiaoBiaoSong-B05S", "方正小标宋简体", "FZXiaoBiaoSongJS", "STSong", "SimSun", serif;
        }

        input,
        button,
        select {
            font-family: inherit;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div id="login-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl w-full max-w-md text-center">
            <h2 class="text-xl font-bold text-amber-400 mb-1">🔐 团委组织部管理登录</h2>
            <p class="text-xs text-slate-400 mb-4">共青团华中科技大学委员会组织部</p>
            <form onsubmit="adminLogin(event)" class="space-y-3">
                <input type="email" id="admin-email" required placeholder="管理员邮箱..."
                    class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm text-slate-100 outline-none focus:border-amber-400">
                <input type="password" id="admin-password" required placeholder="管理员密码..."
                    class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm text-slate-100 outline-none focus:border-amber-400">
                <button type="submit" class="w-full py-2.5 bg-amber-500 font-bold text-slate-950 rounded">验证登录</button>
            </form>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-xl font-bold text-amber-400">共青团华中科技大学委员会组织部招新控制台</h1>
                <p class="text-xs text-slate-400">起于平凡 · 臻于至善</p>
            </div>
            <button onclick="supabaseClient.auth.signOut().then(()=>location.reload())"
                class="text-xs bg-slate-800 px-3 py-1.5 rounded text-rose-400">退出登录</button>
        </header>

        <div class="flex gap-2 mb-6">
            <button onclick="switchTab(0)" id="tab-0"
                class="px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950">待审核</button>
            <button onclick="switchTab(1)" id="tab-1"
                class="px-4 py-2 rounded-lg text-sm font-bold bg-slate-800 text-slate-300">已放行 (公开展示)</button>
            <button onclick="switchTab(2)" id="tab-2"
                class="px-4 py-2 rounded-lg text-sm font-bold bg-slate-800 text-slate-300">已驳回</button>
        </div>

        <div id="admin-list" class="space-y-4">
            <p class="text-slate-500 text-center py-12">请先登录</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yvepocklhzfcazmcssem.supabase.co";
        // 自动填入你提供的密钥
        const SUPABASE_KEY = "sb_publishable_4BKM56OxqjtuDhD15L2Vbw_Jzgj0ndw";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentStatus = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('login-modal').classList.add('hidden');
                loadAdminData();
            }
        });

        async function adminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('登录失败：' + error.message);
            } else {
                document.getElementById('login-modal').classList.add('hidden');
                loadAdminData();
            }
        }

        function switchTab(status) {
            currentStatus = status;
            [0, 1, 2].forEach(s => {
                const btn = document.getElementById(`tab-${s}`);
                btn.className = s === status ? "px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950" : "px-4 py-2 rounded-lg text-sm font-bold bg-slate-800 text-slate-300";
            });
            loadAdminData();
        }

        async function loadAdminData() {
            const { data, error } = await supabaseClient.from('messages')
                .select('*')
                .eq('status', currentStatus)
                .order('created_at', { ascending: false });

            if (error) return alert('读取数据失败：' + error.message);

            const container = document.getElementById('admin-list');
            container.innerHTML = data.length === 0 ? '<p class="text-slate-500 text-center py-12">暂无数据</p>' : '';

            data.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row justify-between gap-4">
                        <div class="flex-1">
                            <div class="flex gap-2 text-xs mb-2">
                                <span class="bg-slate-800 text-amber-400 px-2 py-0.5 rounded">${item.tag}</span>
                                <span class="text-slate-400">${item.is_anonymous ? '匿名' : item.author_name}</span>
                                <span class="text-slate-500">${new Date(item.created_at).toLocaleString()}</span>
                            </div>
                            <p class="text-sm text-slate-200 mb-3">${item.content}</p>
                            
                            <div class="flex gap-2 items-center">
                                <input type="text" id="reply-${item.message_id}" value="${item.reply_content || ''}" placeholder="追加组织部官方回复..." class="bg-slate-950 border border-slate-800 text-xs text-amber-300 p-2 rounded flex-1 outline-none">
                                <button onclick="saveReply(${item.message_id})" class="text-xs bg-indigo-600 px-3 py-2 rounded font-bold">保存回复</button>
                            </div>
                        </div>

                        <div class="flex md:flex-col justify-end gap-2 min-w-[120px]">
                            ${currentStatus !== 1 ? `<button onclick="updateStatus(${item.message_id}, 1)" class="bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 text-xs py-1.5 px-3 rounded hover:bg-emerald-600">放行 (公开)</button>` : ''}
                            ${currentStatus !== 2 ? `<button onclick="updateStatus(${item.message_id}, 2)" class="bg-amber-600/30 text-amber-300 border border-amber-500/40 text-xs py-1.5 px-3 rounded hover:bg-amber-600">驳回 (隐藏)</button>` : ''}
                            <button onclick="deleteMsg(${item.message_id})" class="bg-rose-600/30 text-rose-300 border border-rose-500/40 text-xs py-1.5 px-3 rounded hover:bg-rose-600">删除</button>
                        </div>
                    </div>
                `;
            });
        }

        async function updateStatus(id, newStatus) {
            await supabaseClient.from('messages').update({ status: newStatus }).eq('message_id', id);
            loadAdminData();
        }

        async function saveReply(id) {
            const text = document.getElementById(`reply-${id}`).value;
            await supabaseClient.from('messages').update({ reply_content: text }).eq('message_id', id);
            alert('组织部回复已保存！');
            loadAdminData();
        }

        async function deleteMsg(id) {
            if (confirm('确认删除？不可恢复！')) {
                await supabaseClient.from('messages').delete().eq('message_id', id);
                loadAdminData();
            }
        }
    </script>
</body>

</html>
